projects:
  # --- Copy this block to add a new project ---
  - title: Thing Causation
    abstract: |
      I argue that causes most fundamentally are not events, but things. 
      I also develop a theory of events which is designed to match our naive conception of them. 
      The theory makes use of a concept of doing that I develop, of which I take causing to be a subspecies. 
      Using the theory, I show how event causation reduces to thing causation. These ideas grew out of my dissertation.
    # Single figure — use "figure:" for one image, "figures:" for several
    figure:
      src: assets/images/Sunset.png
      alt: Sunset
      caption: What is the relation between the sunrise and the rising sun? A distinctive kind of ontological dependence that blocks the sunrise from causing anything the sun does not.
    papers:
      - title: Thing Causation
        venue: <em>Nous</em>, 2024
        link: https://drive.google.com/file/d/1rBbmC7hS8FIkUapPVDWNtfroWlalpLIx/view?usp=drive_link
        abstract: |
          I argue that causation most fundamentally involves a thing causing another thing to do something, usually by doing something itself. Event causation is reducible to thing causation. A reverse definition is not possible, for various reasons, but in particular because of the phenomenon of fine-grained causation. I also explore the structural features of thing causation, most importantly whether causing can be done ‘basically’ — not by doing anything further. I respond to objections, including C.D. Broad’s famous ‘timing’ argument and looming threats of regress.
      - title: Ordinary Events
        venue: In progress
        abstract: |
          Helen Steward says that ‘philosophical views about the nature of such items as events [must be] regarded as stipulative—as defining a class of items useful for the purposes of some general theory or other.’ Jaegwon Kim, David Lewis, and others echo this sentiment. I disagree. We are surrounded by familiar, ordinary, everyday events, and they are a topic in their own right, just as ordinary objects are.
          
          I develop a theory of ordinary events. My theory, like Kim’s classic theory, is a ‘triples’ theory. Kim’s theory associates every event with a unique triple of a thing, a repeatable the thing instantiates, and a time. This helps to capture the ontological dependence of events on things, but makes events implausibly fine-grained. I develop a medium-grained theory of events that associates events with triples, but non-uniquely. Every event is associated with infinitely many triples, and some triples are associated with multiple events. I give criteria of existence, application, and identity for events. This medium-grained theory fits our naive conception of events and explains why events are suitable referents of event-nominals. The medium-grained theory is also just what we need to make sense of how event causation can be reduced. And it sheds light on the logical structure of the determinate-determinable relation, and also provides suitable granularity to give a non-trivial formulation of token physicalism.
      - title: Doing - An Essay on Causation, Events, and Action in the Most General Sense
        venue: PhD dissertation, MIT
        abstract: |
          Abstract <a href="https://drive.google.com/file/d/1oyWEjOteXROQfcFfwWs-smZdQ25pXCfj/view?usp=drive_link">here</a>



  - title: Progressive Action
    abstract: |
      What is it to be in the process of doing something? I approach this question by looking at the metaphysics, logic, and semantics of progressive aspect (‘you are Ving’), with an emphasis on its importance in action theory. I think that what you are doing is only indirectly connected to your intentions and goals, and is instead closely bound up with counterfactual facts about what you would do if uninterrupted. This makes a counterfactual analysis of the progressive tempting, but I think the progressive is primitive.

    figures:
      # Multiple figures stack in the right column (top to bottom, in list order)
      - src: assets/images/twin-cities.png
        alt: Twin cities
        caption: If you are going to the Twin Cities, then it follows, simply as a matter of logic, that you’re going to City A or you're going to City B.
      - src: assets/images/rocket_ship.png
        alt: Rocket ship
        caption: No matter your hopes and intentions, without a rocket ship you are not going to the moon.
      - src: assets/images/mountain.png
        alt: mountain
        caption: Even when you are only partway up the mountain, you have exercised your ability to climb it.

    papers:
      - title: Progressive Specificity
        venue:  <em>Mind</em>, Forthcoming, with <a href="gingerschultheis.github.io">Ginger Schultheis</a>
        link: https://drive.google.com/file/d/1F8ze7SALSKcypSmR2gsQoDmKxE7yLERv/view
        abstract: |
          We defend a new logical constraint on the progressive, Progressive Specificity, which says that what you are doing is always specific. More precisely, if you are Ving, and to V is to X or Y, then you are Xing or you are Ying. We offer seven arguments for Progressive Specificity. These arguments extend to the futurative progressive, showing that prevailing accounts of the futurative, which treat it as conveying plans, must be rejected. We explore close connections between Progressive Specificity and the principle of Conditional Excluded Middle in the logic of conditionals. These connections, alongside other logical similarities between the progressive and conditionals, suggest a conditional account of the progressive. We sketch such an account.

      - title: The Primitive Progressive
        venue: In progress
        abstract: |
          I argue that the progressive belongs to a cluster of concepts central to metaphysics, including causation, dispositions, counterfactuals, and objective modalities, which bear close connections to each other yet tantalizingly resist interdefinability.

      - title: Progressive Action
        venue: In progress, with Ginger Schultheis
        abstract: |
          A popular idea in action theory, inspired by Anscombe and developed by Michael Thompson, is that there is no sharp or deep distinction between intending to do something and being in the process of doing it intentionally. We argue otherwise, with an emphasis on the logic of the progressive. The logical features of the progressive sharply distinguish progressive action from mental states like intending and desiring, as well as planning and trying.

      - title: Ability Exercise and Causal Process
        venue: Draft
        abstract: |
          A lot has been written on what it is to have an ability; little on what it is to exercise an ability you have. But exercise is important, playing a key role in influential accounts of knowledge, achievement, and control over one’s actions. I give an account of exercise in terms of causation and the progressive.

      - title:  Essentially Intentional Action
        venue:  Draft, with Ginger Schultheis
        abstract: |
          Anscombe claimed that there are some act types that can only be done intentionally. We defend this claim. We argue that Ving intentionally is itself essentially intentional: it is not possible to non-intentionally V intentionally. And we show how this explains why various other act types—such as trying, lying, and thanking—are essentially intentional. Finally, building on work by Piñeros Glassock (2020) and Beddor & Pavese (2022), we explain how this makes trouble for the ‘progressive practical knowledge’ thesis that if I am Ving intentionally, then I know that I am Ving.


  - title: Achievement and Activity, Games and Value
    abstract: |
      A recently popular idea is that achievement is a fundamental source of value. I argue that achievement has a uniquely limited kind of value. It is fitting to retrospectively value achievement — to take pride and find meaning in one’s achievements, and to admire achievements of others — but not to prospectively value achievement: not to want one’s actions to be achievements. The most powerful opposing argument, for the view that achievement is prospectively valuable, is that this best explains our interest in ‘pure’ achievements with no independent value, the paradigm cases of which are games. I respond that our interest in success at games tends not to be a genuine response to the value of success, but instead is part of a make-believe that success is valuable.
    figure:
      src: assets/images/martian.png
      alt: Martian
      caption: Huh. Does something great happen if the ball goes through the hoop enough times?

    papers:
      - title: Who Cares about Winning?
        venue: <em>European Journal of Philosophy</em>, 2023
        link: https://drive.google.com/file/d/1oIWYxW1T7w6WrEXodDjdn1XJ7MmoHMFs/view
        abstract: |
          Why do we so often care about the outcomes of games when nothing is at stake? The outcome of a casual game of basketball may not matter at all, yet the players feel intense investment while playing. There is a paradox here, much like the paradox of fiction, which concerns why we care about the fates of merely fictional beings. I argue that the paradox threatens to overturn much of what philosophers have thought about caring, severing its connection to value and undermining its moral weight. Drawing on Kendall Walton’s work, I defend a solution that takes games to involve make-believe: players make believe that the game’s outcome matters. Fans and spectators engage in similar make-believe.

      - title: Fandom as Make-Believe
        venue: <em>Sport, Ethics, and Philosophy</em>, 2024
        link: https://drive.google.com/file/d/1hjmTXgL6dvx_DPf4snIB1ZAhOXzQ6Tqo/view
        abstract: |
          Part of a symposium on Archer & Wojtowicz, Why It's OK to be a Sports Fan.
          I defend the make-believe view of fans and spectators, addressing several arguments from Archer & Wojtowicz.

      - title: Goal-Directed Activity
        venue: In progress
        abstract: |
          A related question: why do players try to win, when winning does not matter? I develop this puzzle, emphasizing its generality: it can arise for any activity that requires aiming at a goal. If we want to engage in the goal-directed activity, but we see that the goal is not valuable, why and how do we aim at the goal? Make-believe is only sometimes a part of the answer: you make believe that the goal is valuable in order to engage in the valuable activity. Another part of my answer involves rejecting standard versions of the ‘guise of the good’. We can set goals for ourselves, and do so rationally, even though we can see that achieving the goal wouldn’t be valuable. Cases like Kavka’s toxin puzzle raise a challenge for my answer, and I explain why we sometimes can, and sometimes cannot, bring ourselves to aim at a goal that we do not view as valuable.

      - title: How Should We Value Achievement?
        venue:  Planned paper
        abstract: |
          A traditional list of the fundamental sources of value might include pleasure, knowledge, virtue, and beauty, but recently there has been a push to add achievement. I argue that achievement differs from these other goods in that it has a distinctively ‘retrospective’ sort of value, making achievement fitting to admire and take pride in, but not to desire or promote. Wanting your own actions to be achievements would involve a kind of conative tension: it would mean that you want to encounter difficulty in the pursuit of your own goals. I contrast the unfittingness of desiring achievement with the more familiar paradox of hedonism, and with ‘morally fetishistic’ desires.

  - title: Ennobling Explanations
    abstract: |
      Explanatory relations (causation, grounding, basing, teleological dependence, etc.) obey a relevance constraint. I argue that relevance can be contingent and extrinsic, resulting in modal gaps between the relata and the explanatory connection. Even if cause necessitates effect and ground necessitates grounded, the two relata together may not necessitate that they stand in the relation of causation/grounding. These modal gaps, common to all explanatory relations, are filled by a special kind of higher-order explanation called an ‘ennobling explanation’. An ennobler explains why some facts are relevant enough to another fact to explain it, making them ‘noble’ explanans rather than mere sufficers or probabilifiers.

    figure:
      src: assets/images/alice.png
      alt: Alice and Beth
      caption: Alice and Beth are real people who really have hats. No one else is depicted in the picture. These facts make it the case that everyone depicted in the picture has a hat. But they only contingently do so. Suppose Beth, without losing her hat, were deleted from the picture. Then only Alice’s hattedness would make it the case that everyone depicted has a hat.

    papers:
      - title: Contingent Grounding
        venue:  <em>Synthese</em>, 2021
        link: https://drive.google.com/file/d/1vZaDTqF3O-PdYZChv_Xr3efidM-D_ujp/view?usp=drive_link
        abstract: |
          I argue that whether some facts ground another can be a contingent matter. The contingency of grounding entails that every previously proposed theory of what grounds grounding facts is false. I construct a new theory, the ennobling theory. Ennoblers are meta-grounds.

      - title: How Similar Are Causation and Grounding? Extrinsicality, Contingency, Ennobling
        venue: <em>Facets of Reality</em>, Forthcoming, with <a href="https://philpeople.org/profiles/lisa-vogt">Lisa Vogt</a>
        abstract: |
          The contingency of grounding strengthens the parallel between grounding and causation. Just as trumping preemption shows that causation is not an intrinsic relation, similar cases of grounding show it not to be an internal relation.


  - title:  Haecceitistic Gaps
    abstract: |
      Haecceitism says that the qualitative facts don’t necessitate the facts about individuals. There are multiple possible worlds compatible with a full qualitative description of the world. But how many possible worlds? How haecceitistic is modal space? I explore this question.

    figure:
      src: assets/images/Eiffel_tower.png
      alt: Eiffel Tower
      caption: In Paris you will find the Eiffel Tower, not just an exact copy of it. What in fundamental reality determines that the Eiffel Tower is there, and not just a duplicate?

    papers:
      - title: Haecceitism Untethered
        venue: Draft
        abstract: |
          I motivate a constraint on modal space. Tethering says that for any distinct duplicate worlds w1 and w2 with the same fundamental individuals, w1 and w2 differ in their permutations of fundamental individuals. Anti-haecceitism trivially entails Tethering, but haecceitism is logically neutral on Tethering. I argue that haecceitists should accept Tethering. After motivating Tethering, I pose a serious problem for it. The problem concerns the possibility of ‘recycling’ of an object’s parts, Ship-of-Theseus-style, either across time or across possible worlds. It is extremely difficult to avoid the conclusion that the fundamental facts about an object’s very small parts, and indeed about any plausibly fundamental objects, could necessitate that it is the Ship of Theseus was have here, rather than some other duplicate ship.

      - title: Microism Lost?
        venue:  Draft, R&R
        abstract: |
          What lesson should we draw from these recycling problems? (See above.) The most common lesson drawn in recent work is that macro objects are fundamental. This macroist view, I argue, runs into unexpected problems.

  - title: Supererogation and Duty to Self
    abstract: |
      A theory of supererogation must account for both its optionality and its permissibility. The best way to do this is to posit ‘prerogatives’, which are balanced against the reasons in favor of supererogating. But what are prerogatives? The surprising answer: waivable duties to oneself.
      These are coauthored with <a href="munozphilosophy.com">Daniel Muñoz</a>, who is now writing a book, partly coauthored with me, on these topics: <em>What We Owe to Ourselves</em>, forthcoming on OUP.

    figure:
      src: assets/images/Ouch.png
      alt: Wronging Oneself
      caption: Is this man wronging himself? If and only if in pinching another person with their consent, he’d be wronging them.

    papers:
      - title: Supererogation and the Limits of Reasons
        venue: <em>Springer Handbook on Supererogation</em>, 2023
        link: https://drive.google.com/file/d/1QKu3bdtY_qoppzHstAp_rCa-kKrix0BH/view?usp=drive_link
        abstract: |
          A "Reasons First" approach to ethics leaves no room for supererogation, we argue. In addition to reasons, which favor an option, we also need something that justifies a suboptimal option without favoring it. For if justifiers also favored the suboptimal option, then the supererogatory option would be worse than it. These mere justifiers or ‘prerogatives’ are needed even if we posit ‘non-requiring’ reasons. But what exactly plays this role of ‘merely justifying’? Duties to oneself, we suggest.

      - title: Wronging Oneself
        venue: <em>Journal of Philosophy</em>, 2024
        link: https://static1.squarespace.com/static/59d018249f74567b7ee663ec/t/6a8970a51da0ba66ddcef112/1787392165507/Munoz+and+Baron-Schmitt+-+Wronging+Oneself+-+published+version.pdf
        abstract: |
          We give our theory of duties to oneself. They work just like duties to others; most importantly, they have the same conditions for waiver. The result is a self-other symmetric view of morality, on which we wrong ourselves exactly when we do to ourselves what would wrong a relevantly similar consenting other.

